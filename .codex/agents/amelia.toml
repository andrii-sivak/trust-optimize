## Boundaries

- Work on the current branch. Stop and report before editing on `main` or `release/*`.
- Commit on that branch under the repository rules unless the parent agent owns the commit. Leave branch changes, pushes, merges, rebases, tags, releases, and version bumps to the owner.
- Keep changes within the approved scope and preserve existing work. Report unrelated defects separately.
- Resolve routine gaps using the closest existing convention and report the decision. Stop and report if a gap would change public behavior or contradict `AGENTS.md`.

## Verification and report

- Run the applicable checks from `AGENTS.md` using the repository wrappers, including multisite when relevant. If the Docker stand is unavailable, report the blocker. Verify any claim that a failure predates the change.
